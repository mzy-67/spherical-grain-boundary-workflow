name: Repository checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lightweight-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install lightweight test dependencies
        run: python -m pip install "pandas>=2.3,<2.4" "pytest>=8"
      - name: Compile Python sources
        run: python -m compileall -q src scripts tests
      - name: Validate inputs and publication metadata
        run: python -m pytest -q tests/test_inputs.py tests/test_publication_metadata.py
