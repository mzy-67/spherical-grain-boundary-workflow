name: Repository checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lightweight-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install lightweight test dependencies
        run: python -m pip install "numpy>=2.1,<2.2" "pandas>=2.3,<2.4" "PyYAML>=6" "pytest>=8"
      - name: Compile Python sources
        run: python -m compileall -q src scripts tests
      - name: Run lightweight tests
        run: python -m pytest -q
