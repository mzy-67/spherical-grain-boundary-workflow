# Material-agnostic template. Copy this file to workflow.local.yaml and edit it.
workflow:
  name: spherical-grain-boundary

inputs:
  orientation_file: /path/to/orientations.csv
  structure_file: /path/to/bulk_structure.cif
  bulk_energy_trajectory: /path/to/bulk_reference.lammpstrj

material:
  # LAMMPS atom types follow this exact one-based order.
  species_order: [Na, Cl]
  # Optional mass overrides in atomic mass units; omitted species use pymatgen values.
  masses: {}
  mobile_species: Na
  charge_number: 1
  # Optional species used to anchor the bulk cell before replication.
  origin_anchor_species: null

transport:
  enabled: true

potential:
  # Commands become: pair_style <pair_style> <formatted pair_style_args>
  pair_style: deepmd
  checkpoint_file: /path/to/model.pb
  pair_style_args: "{checkpoint_file}"
  pair_coeff: "* *"

grain_boundary:
  sphere_radius: 45.0
  vacuum_thickness: 20.0
  energy_radius: 35.0

annealing:
  temperature_K: 1200.0
  equilibration_steps: 1000
  quench_steps: 20000

optimization:
  trials: 200
  random_seed: 42
  base_estimator: GP
  acq_func: EI
  acq_optimizer: lbfgs

simulation:
  lammps_executable: lmp
  mobile_radius_A: 39.0
  msd_analysis_radius_A: 35.0
  msd_slab_half_thickness_A: 15.0
  timestep_ps: 0.001
  equilibration_steps: 4000
  production_steps: 50000
  trajectory_dump_interval: 500
  fit_min_ps: 10.0
  fit_max_ps: 50.0
  temperatures_K: [973.15, 1073.15, 1173.15, 1273.15]

submission:
  worker: my_worker
  project: my_project
  partition: gpu
  nodes: 1
  processes_per_node: 1
  gpus_per_job: 1
  cpus_per_gpu: 10
  memory: 32G
