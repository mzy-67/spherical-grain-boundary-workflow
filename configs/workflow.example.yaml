inputs:
  orientation_file: inputs/gb_orientations.csv
  structure_file: inputs/sorted_optimized_bulk_POSCAR
  bulk_energy_trajectory: inputs/bulk_energy_reference.lammpstrj

potential:
  checkpoint_file: /absolute/path/to/LLZO-c.pb

grain_boundary:
  sphere_radius: 45.0
  vacuum_thickness: 20.0
  energy_radius: 35.0

optimization:
  trials: 200
  random_seed: 42

# These values reproduce the MD protocol described in the manuscript.
simulation:
  lammps_executable: lmp
  mobile_radius_A: 39.0
  msd_analysis_radius_A: 35.0
  msd_slab_half_thickness_A: 15.0
  timestep_ps: 0.001
  equilibration_steps: 4000
  production_steps: 50000
  trajectory_dump_interval: 500
  fit_min_ps: 10.0
  fit_max_ps: 50.0
  temperatures_K: [973.15, 1073.15, 1173.15, 1273.15]

submission:
  worker: llzo_worker
  project: std
  partition: gpu
  nodes: 1
  processes_per_node: 1
  gpus_per_job: 1
  cpus_per_gpu: 10
  memory: 32G
