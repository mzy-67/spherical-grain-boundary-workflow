# One-row LLZO smoke test using examples/single_gb/orientation.csv.
workflow:
  name: llzo-single-spherical-gb
inputs:
  orientation_file: examples/single_gb/orientation.csv
  structure_file: inputs/sorted_optimized_bulk_POSCAR
  bulk_energy_trajectory: inputs/bulk_energy_reference.lammpstrj
material:
  species_order: [Li, La, Zr, O]
  masses: {Li: 6.941, La: 138.9055, Zr: 91.224, O: 15.9994}
  mobile_species: Li
  charge_number: 1
  origin_anchor_species: Zr
transport:
  enabled: true

potential:
  pair_style: deepmd
  checkpoint_file: /absolute/path/to/LLZO-c.pb
  pair_style_args: "{checkpoint_file}"
  pair_coeff: "* *"
grain_boundary: {sphere_radius: 45.0, vacuum_thickness: 20.0, energy_radius: 35.0}
annealing:
  temperature_K: 1200.0
  equilibration_steps: 1000
  quench_steps: 20000

optimization: {trials: 10, random_seed: 42, base_estimator: GP, acq_func: EI, acq_optimizer: lbfgs}
simulation:
  lammps_executable: lmp
  mobile_radius_A: 39.0
  msd_analysis_radius_A: 35.0
  msd_slab_half_thickness_A: 15.0
  timestep_ps: 0.001
  equilibration_steps: 4000
  production_steps: 50000
  trajectory_dump_interval: 500
  fit_min_ps: 10.0
  fit_max_ps: 50.0
  temperatures_K: [973.15, 1073.15, 1173.15, 1273.15]
submission: {worker: llzo_worker, project: std, partition: gpu, nodes: 1, processes_per_node: 1, gpus_per_job: 1, cpus_per_gpu: 10, memory: 32G}
